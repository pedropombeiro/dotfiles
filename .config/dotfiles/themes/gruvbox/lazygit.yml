  # Theme-only GUI settings. Keep workflow settings in config.yml.theme.
  theme:
    activeBorderColor:
      - "#97971a"
      - bold
    inactiveBorderColor:
      - "#928374"
    searchingActiveBorderColor:
      - "#83a598"
      - bold
    optionsTextColor:
      - "#8ec07c"
    selectedLineBgColor:
      - "#458588"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#458588"
    cherryPickedCommitBgColor:
      - "#83a598"
    markedBaseCommitFgColor:
      - "#458588"
    markedBaseCommitBgColor:
      - yellow
    unstagedChangesColor:
      - "#fb4934"
    defaultFgColor:
      - "#ebdbb2"
    authorColors:
      "Pedro Pombeiro": "#83a598"
    branchColorPatterns:
      "^\\^pedropombeiro/(/|$)": "#83a598"
      "^\\^_pedropombeiro/(/|$)": "#7c6f64"
      "^tmp(/|$)": "#504945"
