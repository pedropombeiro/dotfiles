[env]
# The NAS has no D-Bus session bus. Without one, the 1Password CLI autolaunches a
# dbus-daemon on every call, and the daemons never exit: thousands of them used up root's
# inotify instances. "disabled:" makes the lookup fail instead. Set here, the mise shims
# apply it to every op call, whichever shell, script or cron job runs it.
DBUS_SESSION_BUS_ADDRESS = "{{ get_env(name='DBUS_SESSION_BUS_ADDRESS', default='disabled:') }}"
