[tools]
# ── Shell UX ──────────────────────────────────────────────────────────
# Shell history with sync and search
atuin = "latest"
# Interactive disk usage analyzer
dua = "latest"
# Fast alternative to find
"aqua:sharkdp/fd" = "latest"
# Tmux session manager
"aqua:joshmedeski/sesh" = "latest"

# ── Developer workflow ────────────────────────────────────────────────
# Git hook manager
hk = "latest"
# Pkl configuration language (required by hk)
pkl = "latest"
# Utilities for working with patches (filterdiff, etc.)
"github:twaugh/patchutils" = "latest"

# ── Linting & formatting ──────────────────────────────────────────────
# Secrets scanner for git repos
"aqua:gitleaks/gitleaks" = "latest"
# Shell script linter
shellcheck = "latest"
# Shell script formatter
shfmt = "latest"
# Lua code formatter
stylua = "latest"
# Spell checker for source code
typos = "latest"
# EditorConfig file format checker
"aqua:editorconfig-checker/editorconfig-checker" = "latest"
# JSON/Markdown/YAML formatter
prettier = "latest"

# ── AI tooling ────────────────────────────────────────────────────────
# Lazy-loading MCP server proxy for AI tools
# aube's low-download gate (<1000 weekly) blocks this. It's a GitLab-org tool
# (gitlab.com/gitlab-org/ai/lazy-mcp, maintainer dgruzd@gitlab.com), niche by
# design, so the popularity signal will never clear the threshold.
"npm:lazy-mcp" = { version = "latest", allow_low_downloads = true }
