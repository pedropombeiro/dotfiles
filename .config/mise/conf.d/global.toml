# Keep every machine at or above the mise version CI pins in
# .github/workflows/ci.yml. Soft, so a lagging QTS install warns instead of
# breaking shell activation. Renovate bumps both together.
# renovate: datasource=github-releases depName=jdx/mise
min_version = { soft = "2026.9.14" }

[tools]
# ── Shell UX ──────────────────────────────────────────────────────────
# Shell history with sync and search
atuin = "latest"
# Interactive disk usage analyzer
dua = "latest"
# Fast alternative to find
"aqua:sharkdp/fd" = "latest"
# Tmux session manager
"aqua:joshmedeski/sesh" = "latest"
# Timestamps each line of command output
"github:zmwangx/ets" = "latest"

# ── Developer workflow ────────────────────────────────────────────────
# Git hook manager; keep in sync with the package URLs and min_hk_version in ~/hk.pkl
hk = "2.1.0"
# Utilities for working with patches (filterdiff, etc.)
"github:twaugh/patchutils" = "latest"
# Docker image layer explorer
"aqua:wagoodman/dive" = "latest"

# ── Linting & formatting ──────────────────────────────────────────────
# Secrets scanner for git repos
"aqua:gitleaks/gitleaks" = "latest"
# Shell script linter
shellcheck = "latest"
# Shell script formatter
shfmt = "latest"
# Lua code formatter
stylua = "latest"
# Spell checker for source code
typos = "latest"
# JSON/Markdown/YAML formatter
prettier = "latest"
# Python static type checker
"pipx:mypy" = "latest"

# ── AI tooling ────────────────────────────────────────────────────────
# Lazy-loading MCP server proxy for AI tools
# aube's low-download gate (<1000 weekly) blocks this. It's a GitLab-org tool
# (gitlab.com/gitlab-org/ai/lazy-mcp, maintainer dgruzd@gitlab.com), niche by
# design, so the popularity signal will never clear the threshold.
"npm:lazy-mcp" = { version = "latest", allow_low_downloads = true }

# EditorConfig file format checker
[tools."github:editorconfig-checker/editorconfig-checker"]
version = "latest"

[tools."github:editorconfig-checker/editorconfig-checker".platforms]
macos-arm64 = { asset_pattern = "editorconfig-checker-darwin-all.tar.gz" }
