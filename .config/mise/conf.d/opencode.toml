[env]
# Per-machine credential stays outside yadm. Unprovisioned machines can still
# export on the LAN. See ~/.agents/docs/opencode.md#configure-telemetry-authentication.
OPENCODE_OTLP_HEADERS = { value = "{% set path = xdg_config_home ~ '/opencode/otel-headers' %}{% if path is file %}{{ read_file(path=path) | trim }}{% endif %}", redact = true }
