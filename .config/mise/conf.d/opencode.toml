[env]
OPENCODE_PLAN_MODEL = "opencode-go/kimi-k3.1-pro"
OPENCODE_BUILD_MODEL = "opencode-go/minimax-m3.1-flash"
# The title and explore agents need a model that speaks the OpenAI-compatible
# API the Go proxy forwards. Claude Haiku speaks the Anthropic API and has the
# smallest monthly limit of the models in use, so it burns the allowance
# fastest.
OPENCODE_FAST_MODEL = "opencode-go/mimo-v2.6-flash"
OPENCODE_OFFLINE_MODEL = "ollama/gemma4:e2b"

# Per-machine credential stays outside yadm. Unprovisioned machines can still
# export on the LAN. See ~/.agents/docs/opencode.md#configure-telemetry-authentication.
OPENCODE_OTLP_HEADERS = { value = "{% set path = xdg_config_home ~ '/opencode/otel-headers' %}{% if path is file %}{{ read_file(path=path) | trim }}{% endif %}", redact = true }
