[env]
# Canonical GitLab Duo models (also used as defaults on non-Work machines and
# as confidential/security fallbacks on Work machines).
OPENCODE_DUO_PLAN_MODEL = "gitlab/duo-chat-gpt-6-2-astra"
OPENCODE_DUO_BUILD_MODEL = "gitlab/duo-chat-gpt-6-2-sol"
OPENCODE_DUO_FAST_MODEL = "gitlab/duo-chat-gpt-6-luna"

OPENCODE_PLAN_MODEL = "gitlab/duo-chat-gpt-6-2-astra"
OPENCODE_BUILD_MODEL = "gitlab/duo-chat-gpt-6-2-sol"
OPENCODE_FAST_MODEL = "gitlab/duo-chat-gpt-6-luna"
OPENCODE_OFFLINE_MODEL = "ollama/gemma4:e2b"

# Per-machine credential stays outside yadm. Unprovisioned machines can still
# export on the LAN. See ~/.agents/docs/opencode.md#configure-telemetry-authentication.
OPENCODE_OTLP_HEADERS = { value = "{% set path = xdg_config_home ~ '/opencode/otel-headers' %}{% if path is file %}{{ read_file(path=path) | trim }}{% endif %}", redact = true }
