# ── Dotfiles ──────────────────────────────────────────────────────────

[tasks."dotfiles:install"]
description = "Install mise tools (with GitHub token)"
run = """
if command -v brew >/dev/null 2>&1; then
  brew bundle --global --quiet
fi

mise install
"""

[tasks."dotfiles:bootstrap"]
description = "Bootstrap the dotfile environment"
raw = true
# Disable mise's own progress — the script manages its own iTerm2 badge/progress
env = { MISE_TERMINAL_PROGRESS = "false" }
run = "yadm bootstrap"

[tasks."dotfiles:update"]
description = "Run dotfile update scripts"
raw = true
# Disable mise's own progress — the script manages its own iTerm2 badge/progress
env = { MISE_TERMINAL_PROGRESS = "false" }
run = "~/.config/yadm/scripts/update.zsh"

[tasks."dotfiles:checkhealth"]
description = "Run dotfile health checks"
run = "~/.config/yadm/scripts/run-checks.zsh"


# ── Network ───────────────────────────────────────────────────────────

[tasks."geoip:update"]
description = "Download or refresh the GeoLite2 City database that trippy reads"
shell = "bash -c"
run = """
set -euo pipefail

# 975-setup-geoip-credentials.sh writes these from 1Password. The GeoLite2
# license requires refreshing the database at least every 30 days.
creds_dir="${XDG_CONFIG_HOME:-$HOME/.config}/geoipupdate"
db_dir="${XDG_DATA_HOME:-$HOME/.local/share}/GeoIP"
if [[ ! -s "${creds_dir}/account-id" || ! -s "${creds_dir}/license-key" ]]; then
  echo "MaxMind credentials are missing from ${creds_dir}." >&2
  echo "Run ~/.config/yadm/bootstrap.d/975-setup-geoip-credentials.sh to configure them." >&2
  exit 1
fi

mkdir -p "${db_dir}"
GEOIPUPDATE_ACCOUNT_ID_FILE="${creds_dir}/account-id" \\
  GEOIPUPDATE_LICENSE_KEY_FILE="${creds_dir}/license-key" \\
  GEOIPUPDATE_EDITION_IDS="GeoLite2-City" \\
  GEOIPUPDATE_DB_DIR="${db_dir}" \\
  geoipupdate
"""

# ── Git ───────────────────────────────────────────────────────────────

[tasks."git:push"]
description = "Push to remote (auto-detects yadm vs git)"
usage = 'arg "<args>..."'
run = """
if [ -d "$HOME/.local/share/yadm/repo.git" ]; then
  yadm push ${usage_args?}
else
  git push ${usage_args?}
fi
"""

[tasks."git:commit"]
description = "Generate an AI commit message and commit staged changes"
dir = "{{cwd}}"
quiet = true
env = { MISE_TERMINAL_PROGRESS = "false" }
usage = 'arg "<type>" default=""'
run = """
if [ -n "${usage_type?}" ]; then
  ~/.local/bin/git-ai-commit-msg --type "${usage_type?}"
else
  ~/.local/bin/git-ai-commit-msg
fi
"""

# ── Default ───────────────────────────────────────────────────────────

[tasks.default]
description = "Fetch dotfiles and run updates"
# A `run` array runs in order; `depends` would run the pull and update in parallel.
run = [{ task = "dotfiles:pull" }, { task = "dotfiles:update" }]
hide = true
