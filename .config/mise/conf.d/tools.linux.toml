[settings.pipx]
uvx = true

[tools]
# ── Runtimes ──────────────────────────────────────────────────────────
# JavaScript runtime
node = "latest"
# Fast Python package and project manager
uv = "latest"
# Go toolchain
go = "latest"

# ── Shell & CLI UX ────────────────────────────────────────────────────
# cat with syntax highlighting
"aqua:sharkdp/bat" = "latest"
# Modern ls replacement
"aqua:eza-community/eza" = "latest"
# The aqua backend only ships fzf. Add fzf-tmux for sesh's tmux popup picker.
"aqua:junegunn/fzf" = { version = "latest", postinstall = '''
if [ ! -f "$MISE_TOOL_INSTALL_PATH/fzf-tmux" ]; then
  echo "Downloading fzf-tmux v${MISE_TOOL_VERSION}..."
  curl -fsSL "https://raw.githubusercontent.com/junegunn/fzf/v${MISE_TOOL_VERSION}/bin/fzf-tmux" -o "$MISE_TOOL_INSTALL_PATH/fzf-tmux"
  chmod +x "$MISE_TOOL_INSTALL_PATH/fzf-tmux"
  mise reshim
fi
''' }
# Smarter cd with frecency tracking
zoxide = "latest"
# Modern watch replacement with diff highlighting
viddy = "latest"
# Friendly HTTP client (like httpie)
xh = "latest"

# ── System monitoring ─────────────────────────────────────────────────
# Log file viewer and navigator
"github:tstack/lnav" = "latest"
# Modern ps replacement
"github:dalance/procs" = "latest"
# TUI system resource monitor (C++ version)
btop = "latest"
# top-like interface for Docker containers
"aqua:bcicen/ctop" = "latest"
# Better df alternative
"aqua:muesli/duf" = "latest"
# Better du alternative
"aqua:bootandy/dust" = "latest"

# ── Network diagnostics ───────────────────────────────────────────────
# Network bandwidth monitor by process
"github:imsnif/bandwhich" = "latest"
# Ping with a real-time graph
"github:orf/gping" = "gping-v1.21.0"
# Command-line DNS client for humans
"aqua:mr-karan/doggo" = "latest"

# ── Git & Docker ──────────────────────────────────────────────────────
# Secure peer-to-peer file transfer
croc = "latest"
# Syntax-highlighting pager for git/diff
"aqua:dandavison/delta" = "latest"
# TUI for git
"aqua:jesseduffield/lazygit" = "latest"
# TUI for Docker management
"aqua:jesseduffield/lazydocker" = "latest"
# GitHub CLI (gh)
"aqua:cli/cli" = "latest"

# ── Search & text ─────────────────────────────────────────────────────
# CLI usage/help generation framework (used by mise)
usage = "latest"
# Terminal file manager
"aqua:sxyazi/yazi" = "26.9.1"
# Fast grep alternative (rg)
"aqua:BurntSushi/ripgrep" = "latest"
# JSON processor
"aqua:jqlang/jq" = "latest"
# Command-line benchmarking tool
"aqua:sharkdp/hyperfine" = "latest"

# ── Linting & formatting ──────────────────────────────────────────────
# (linting tools are declared in global.toml; luacheck runs in its own CI job
# via nebularg/actions-luacheck action)

# ── npm ───────────────────────────────────────────────────────────────
# Auto-generates table of contents in Markdown
"npm:doctoc" = "latest"
# Prose and documentation linter
"npm:@ocular-d/vale-bin" = "latest"

# ── cargo ─────────────────────────────────────────────────────────────
# Generic colourizer for terminal output
"cargo:grc-rs" = "latest"

# ── pipx ──────────────────────────────────────────────────────────────
# Record and share terminal sessions
"pipx:asciinema" = "latest"
# Video downloader (YouTube and more)
"pipx:yt-dlp" = "latest"
# TUI spreadsheet and data explorer
"pipx:visidata" = "latest"
# Python development tools
"pipx:black" = "latest"
"pipx:isort" = "latest"
"pipx:jedi-language-server" = "latest"
"pipx:yamllint" = "latest"
# Simplified community man pages
"pipx:tldr" = "latest"
# Open files in an existing Neovim instance
"pipx:neovim-remote" = "latest"
# Python virtual environment creator
"pipx:virtualenv" = "latest"

[tasks."grc-rs:sync"]
description = "Fetch the grc colour rules that grc-rs reads"
shell = "bash -c"
# grc-rs ships no rules of its own; it reads the grc project's files.
# renovate: datasource=github-tags depName=garabik/grc
env = { GRC_VERSION = "v1.13" }
run = """
set -euo pipefail

data_dir="${XDG_DATA_HOME:-$HOME/.local/share}/grc-rs"
conf="${XDG_CONFIG_HOME:-$HOME/.config}/grc-rs/grc-rs"
stamp="${data_dir}/.grc-version"

if [[ -f "${stamp}" && "$(<"${stamp}")" == "${GRC_VERSION}" && -f "${conf}" ]]; then
  exit 0
fi

tmp=$(mktemp -d)
trap 'rm -r "${tmp}"' EXIT
curl -fsSL "https://github.com/garabik/grc/archive/refs/tags/${GRC_VERSION}.tar.gz" |
  tar -xz -C "${tmp}" --strip-components=1

# Replace the yadm symlinks left behind by the previously tracked copies
[[ -L "${data_dir}" ]] && rm "${data_dir}"
[[ -L "${conf}" ]] && rm "${conf}"
mkdir -p "${data_dir}" "$(dirname "${conf}")"
rm -f "${data_dir}"/conf.*
cp "${tmp}"/colourfiles/conf.* "${data_dir}/"
cp "${tmp}/grc.conf" "${conf}"
printf '%s\\n' "${GRC_VERSION}" >"${stamp}"
echo "Installed grc ${GRC_VERSION} colour rules for grc-rs"
"""
