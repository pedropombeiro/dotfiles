# Tools for the NAS role, independent of its operating system.
[tools]
# Garmin Connect API client
"pipx:garth" = "latest"
# HA-CLI pins regex<2025, which has no Python 3.14 wheel.
"pipx:homeassistant-cli" = { version = "latest", install_env = { UV_OVERRIDE = "{{env.HOME}}/.config/mise/uv-overrides/homeassistant-cli-python314.txt" } }
# Postgres CLI with autocompletion
"pipx:pgcli" = { version = "latest", uvx_args = "--with psycopg2-binary --with psycopg-binary" }

[tools."github:grafana/mcp-grafana"]
version = "2.0.2"
lazy = true
lazy_bins = ["mcp-grafana"]
exe = "mcp-grafana"

[tools."github:grafana/mcp-grafana".platforms]
# Select the native CLI archive, not the similarly named MCP bundle assets.
linux-x64 = { asset_pattern = "mcp-grafana_Linux_x86_64.tar.gz" }
