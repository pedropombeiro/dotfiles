[tools]
# ── Runtimes ──────────────────────────────────────────────────────────
# Ruby runtime. Declared here rather than in config.toml because the work
# machine needs an older pin (see conf.d/tools.work.toml).
ruby = "4.0.6"
# ── Rust tooling ──────────────────────────────────────────────────────
# Install Rust binaries without compiling from source
"aqua:cargo-bins/cargo-binstall" = "latest"

[bootstrap.packages]
# Mac App Store apps
"mas:1569813296" = "latest" # 1Password for Safari
"mas:937984704" = "latest"  # Amphetamine
"mas:425264550" = "latest"  # Blackmagic Disk Speed Test
"mas:1193539993" = "latest" # Brother iPrint&Scan
"mas:640199958" = "latest"  # Developer
"mas:1381004916" = "latest" # Discovery
"mas:302584613" = "latest"  # Kindle
"mas:430255202" = "latest"  # Mactracker
"mas:1663665267" = "latest" # Paperparrot
"mas:375589283" = "latest"  # Parcel
"mas:1229416813" = "latest" # Router
