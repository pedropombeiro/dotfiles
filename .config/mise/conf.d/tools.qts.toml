[settings]
# QTS ships glibc 2.21. Since mise 2026.8.9, the aqua and github backends prefer
# glibc assets on unqualified-glibc Linux hosts, which pulls binaries requiring
# GLIBC 2.29+. Force musl so asset selection stays strict.
# See https://github.com/jdx/mise/pull/12093
libc = "musl"

[settings.python]
precompiled_arch = "x86_64"
precompiled_os = "unknown-linux-gnu"

[env]
# Entware exports this only in login shells; mise must use one Rust proxy path everywhere.
CARGO_HOME = "/opt/share/cargo"

[tools]
# Packages pinned due to QTS glibc constraints (older than 2.31)
python = "3.14"
node = "23.7.0"
rust = { version = "1.98.1", profile = "minimal", targets = "x86_64-unknown-linux-musl" }
# HA-CLI pins regex<2025, but that regex has no cp314 wheel and fails to build on Py3.14.
# Override to a regex release with Python 3.14 support (built from source on this QTS NAS).
"pipx:homeassistant-cli" = { version = "latest", install_env = { UV_OVERRIDE = "/share/homes/admin/.config/mise/uv-overrides/homeassistant-cli.txt" } }

[tasks."grc-rs:sync"]
description = "Fetch the grc colour rules that grc-rs reads"
shell = "bash -c"
# grc-rs ships no rules of its own; it reads the grc project's files.
# renovate: datasource=github-tags depName=garabik/grc
env = { GRC_VERSION = "v1.13" }
run = """
set -euo pipefail

data_dir="${XDG_DATA_HOME:-$HOME/.local/share}/grc-rs"
conf="${XDG_CONFIG_HOME:-$HOME/.config}/grc-rs/grc-rs"
stamp="${data_dir}/.grc-version"

if [[ -f "${stamp}" && "$(<"${stamp}")" == "${GRC_VERSION}" && -f "${conf}" ]]; then
  exit 0
fi

tmp=$(mktemp -d)
trap 'rm -r "${tmp}"' EXIT
curl -fsSL "https://github.com/garabik/grc/archive/refs/tags/${GRC_VERSION}.tar.gz" |
  tar -xz -C "${tmp}" --strip-components=1

# Replace the yadm symlinks left behind by the previously tracked copies
[[ -L "${data_dir}" ]] && rm "${data_dir}"
[[ -L "${conf}" ]] && rm "${conf}"
mkdir -p "${data_dir}" "$(dirname "${conf}")"
rm -f "${data_dir}"/conf.*
cp "${tmp}"/colourfiles/conf.* "${data_dir}/"
cp "${tmp}/grc.conf" "${conf}"
printf '%s\\n' "${GRC_VERSION}" >"${stamp}"
echo "Installed grc ${GRC_VERSION} colour rules for grc-rs"
"""
