[settings]
# QTS ships glibc 2.21. Since mise 2026.8.9, the aqua and github backends prefer
# glibc assets on unqualified-glibc Linux hosts, which pulls binaries requiring
# GLIBC 2.29+. Force musl so asset selection stays strict.
# See https://github.com/jdx/mise/pull/12093
libc = "musl"

[settings.python]
# Entware GCC can't build CPython on QTS. Fail fast when no precompiled build
# exists yet instead of attempting a source build.
compile = false
precompiled_arch = "x86_64"
precompiled_os = "unknown-linux-gnu"

[env]
# Entware exports this only in login shells; mise must use one Rust proxy path everywhere.
CARGO_HOME = "/opt/share/cargo"

[tools]
# Python uses the GNU precompiled build selected above.
python = "3.15.0"
# Use the unofficial glibc-217 Node build.
node = "23.7.0"
# Include the musl target for tools built from source on QTS.
rust = { version = "1.99.0", profile = "minimal", targets = "x86_64-unknown-linux-musl" }
# greenlet's wheels need glibc 2.24+, so it builds from source here. Entware GCC's
# fallback limits.h sets MB_LEN_MAX=1; load the libc limits first to satisfy glibc.
"pipx:neovim-remote" = { version = "latest", install_env = { CPPFLAGS = "-include /opt/include/limits.h" } }

# Pre-built releases compatible with QTS's old glibc.
"github:neovim/neovim-releases[exe=nvim]" = "latest"
"github:pedropombeiro/opencode-legacy-glibc" = "latest"
# Build ets from source on QTS instead of using the shared release binary.
"go:github.com/zmwangx/ets" = "0.2.2"
# Upstream ipinfo binaries need glibc 2.32+. Build a static binary instead.
"go:github.com/ipinfo/cli/ipinfo" = { version = "ipinfo-3.3.2", install_env = { CGO_ENABLED = "0" } }
# Omitted on QTS: rustnet needs glibc 2.32+ and libpcap.

# Entware has no patchutils package and upstream publishes only source
# archives, so build filterdiff and its siblings in the install directory.
# Expose only the installed bin directory, not the build scripts.
[tools."github:twaugh/patchutils"]
version = "latest"
strip_components = 1
bin_path = "bin"
postinstall = '''
set -e
cd "$MISE_TOOL_INSTALL_PATH"
. /opt/bin/gcc_env.sh
./configure --prefix="$MISE_TOOL_INSTALL_PATH" CPPFLAGS="-include /opt/include/limits.h"
make -j"$(nproc)"
make install
'''
