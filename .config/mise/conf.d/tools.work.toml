[env]
HISTIGNORE = "*AWS_SECRET*:*AWS_ACCESS*:*glpat-*:*glrt-*:*gloas-*:*PRIVATE-TOKEN*:*CLIENT_SECRET*"
# GitLab's asdf-gitlab-ruby plugin only downloads prebuilt binaries when this is
# set, otherwise it compiles from source via ruby-build (slow, and slower still
# with jobs = 1). The GDK sets it in its own mise.toml, but installs launched
# from anywhere else (notably `mise install --yes` in yadm's update.zsh) would
# rebuild Ruby from scratch. Set it here so every install on this machine uses
# the prebuilt binary.
USE_PRECOMPILED_RUBY = "true"

[tools]
# ── Runtimes & infra ──────────────────────────────────────────────────
# Ruby runtime
# Pinned to 3.4.9: global ruby resolves through GitLab's asdf-gitlab-ruby plugin,
# whose versions.txt has no macos/arm64 build past 3.4.9. Newer pins fall back to
# a slow source compile, which leaves ruby missing and silently degrades the
# gem: backend to system Ruby 2.6.
ruby = "4.0.6"
# Go toolchain
go = "1.27.1"
# OLAP database
clickhouse = "25.12.11.4-stable"
# Zero-trust infrastructure access (SSH/k8s/DB)
teleport-community = "17"

# ── AI tooling ────────────────────────────────────────────────────

# Browser control for AI agents
"github:pinchtab/pinchtab" = "latest"

# ── GitLab tooling ────────────────────────────────────────────────────
# GitLab CLI
glab = "latest"
# GitLab Duo AI CLI
"npm:@gitlab/duo-cli" = "latest"
uv = "latest"

[bootstrap.packages]
# Mac App Store apps
"mas:937984704" = "latest"  # Amphetamine
"mas:411461952" = "latest"  # Backdrop
"mas:411643860" = "latest"  # DaisyDisk
"mas:1381004916" = "latest" # Discovery
"mas:913158085" = "latest"  # Expressions
"mas:430798174" = "latest"  # HazeOver
"mas:408981434" = "latest"  # iMovie
"mas:302584613" = "latest"  # Kindle
"mas:430255202" = "latest"  # Mactracker
"mas:510620098" = "latest"  # MediaInfo
"mas:563706976" = "latest"  # MusicBuddy
"mas:1439967473" = "latest" # Okta Extension App
"mas:375589283" = "latest"  # Parcel
"mas:1157491961" = "latest" # PLIST Editor
"mas:1153157709" = "latest" # Speedtest
"mas:1451685025" = "latest" # WireGuard

[tasks."system:fix"]
description = "Run system fix actions manually"
run = """
set -eu

hs -c 'require("sleepwake").restoreServices()'

killall eqMac 2>/dev/null || true
while pgrep -xq eqMac 2>/dev/null; do sleep 0.5; done
sleep 1
open -b com.bitgapp.eqmac
hs -c 'require("audio").setDockedAudioOutput()'

~/.config/yadm/scripts/run-checks.zsh
"""

[tasks."iterm:setup"]
description = "Set up iTerm2 window with standard Work tabs and start GDK"
run = "$HOME/.config/yadm/scripts/iterm2-setup.sh"
