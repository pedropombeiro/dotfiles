#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

[[session]]
name = "Downloads"
path = "~/Downloads"
startup_command = "yazi"
preview_command = "eza --all --icons --color=always --sort=modified --reverse {}"

[[session]]
name = "Hammerspoon config"
path = "~/.hammerspoon"
startup_command = "nvim -c ':lua Snacks.picker.files()'"
preview_command = "eza --all --git --icons --color=always {}"

[[wildcard]]
pattern = "~/Developer/github.com/pedropombeiro/*"
disable_startup_command = true
preview_command = "eza --all --git --icons --color=always {}"
