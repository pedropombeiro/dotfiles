#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

[[session]]
name = "Weekly log"
path = "~/Developer/gitlab.com/pedropombeiro/weekly-log"
startup_command = "opencode --agent=build --model=gitlab/duo-chat-gpt-5-6-sol"
preview_command = "eza -TL=3 --almost-all --git --icons --reverse --color=always {}/{brain,logs}"

[[session]]
name = "FFP Report"
path = "~/Developer/gitlab.com/gitlab-org/ci-cd/fix-pipeline-flow-report"
startup_command = "opencode --agent=build --model=gitlab/duo-chat-gpt-5-6-sol"
preview_command = "eza -TL=3 --almost-all --git --icons --reverse --color=always {}/public"

[[session]]
name = "Handbook"
path = "~/Developer/gitlab.com/gitlab-com/content-sites/handbook"
startup_command = "nvim"
preview_command = "eza --all --git --icons --color=always {}"

[[session]]
name = "www-gitlab-com"
path = "~/Developer/gitlab.com/gitlab-com/www-gitlab-com"
startup_command = "nvim -c ':lua Snacks.picker.git_files()'"
preview_command = "eza --all --git --icons --color=always {}"
