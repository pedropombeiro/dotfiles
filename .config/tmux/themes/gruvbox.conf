# Preserve the original dark256 palette without a theme plugin.
set -g status-style 'bg=default,fg=colour223'
set -gw window-status-style 'bg=default,fg=colour237'
set -gw window-status-current-style 'bg=default,fg=colour237'
set -gw window-status-activity-style 'bg=colour237,fg=colour248'
set -g message-style 'bg=colour239,fg=colour223'
set -g message-command-style 'bg=colour248,fg=colour237'
set -g pane-border-style 'fg=colour237'
set -g pane-active-border-style 'fg=colour250'
set -g display-panes-active-colour colour250
set -g display-panes-colour colour237
set -gw clock-mode-colour colour109
set -g status-left '#[bg=colour241,fg=colour248] #S #[bg=colour237,fg=colour241,nobold,noitalics,nounderscore]'
set -g status-right '#[bg=default,fg=colour239,nobold,nounderscore,noitalics]#[bg=colour239,fg=colour246] %Y-%m-%d  %H:%M #[bg=colour239,nobold,noitalics,nounderscore]#{?client_prefix,#[fg=colour214],#{?pane_in_mode,#[fg=colour109],#{?pane_synchronized,#[fg=colour208],#[fg=colour248]}}}#{tmux_mode_indicator}'

set -g @mode_indicator_prefix_mode_style 'bg=colour214,fg=colour237'
set -g @mode_indicator_copy_mode_style 'bg=colour109,fg=colour237'
set -g @mode_indicator_sync_mode_style 'bg=colour208,fg=colour237'
set -g @mode_indicator_empty_mode_style 'bg=colour248,fg=colour237'
set -g @fingers-hint-style 'fg=colour208,bold'
set -g @fingers-highlight-style 'fg=colour214'
