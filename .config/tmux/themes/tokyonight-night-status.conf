# Orange denotes waiting; the active window remains blue, including when waiting.
set -gw window-status-bell-style default
set -gw window-status-format "#{?@opencode-waiting,#[bg=##ff9e64#,fg=##16161e#,nobold#,noitalics#,nounderscore],#[bg=##292e42#,fg=##16161e#,nobold#,noitalics#,nounderscore]}#{?@opencode-waiting,#[fg=##16161e],#[fg=##a9b1d6]} #I  #{?@opencode-waiting,● ,}#W#{?window_zoomed_flag,*Z,} #[bg=#16161e]#{?@opencode-waiting,#[fg=##ff9e64],#[fg=##292e42]}"
set -gw window-status-current-format "#[bg=#7aa2f7,fg=#16161e,nobold,noitalics,nounderscore]#[fg=#16161e] #I  #[bold]#{?@opencode-waiting,#[bg=##16161e#,fg=##ff9e64]●#[bg=##7aa2f7#,fg=##16161e] ,}#W#{?window_zoomed_flag,*Z,} #[bg=#16161e,fg=#7aa2f7,nobold,noitalics,nounderscore]"
