# Orange denotes waiting; the active window remains blue, including when waiting.
set -gw window-status-bell-style default
set -gw window-status-format "#{?@opencode-waiting,#[bg=##ff9e64#,fg=##16161e],#[bg=##292e42#,fg=##a9b1d6]} #I #{?@opencode-waiting,● ,}#W#{?window_zoomed_flag,*Z,} #[default]"
set -gw window-status-current-format "#[bg=#7aa2f7,fg=#16161e,bold] #I #{?@opencode-waiting,#[fg=##ff9e64]● #[fg=##16161e],}#W#{?window_zoomed_flag,*Z,} #[default]"
