# Native tmux styles, without a separate theme plugin.
set -g status-style 'bg=#16161e,fg=#a9b1d6'
set -gw window-status-style 'bg=#16161e,fg=#a9b1d6'
set -gw window-status-current-style 'bg=#16161e,fg=#16161e'
set -gw window-status-activity-style 'bg=#16161e,fg=#a9b1d6'
set -g message-style 'bg=#292e42,fg=#c0caf5'
set -g message-command-style 'bg=#3b4261,fg=#c0caf5'
set -g display-panes-active-colour '#7aa2f7'
set -g display-panes-colour '#565f89'
set -gw clock-mode-colour '#7aa2f7'
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g status-left '#[bg=#7aa2f7,fg=#16161e,bold] #S #[bg=#16161e,fg=#7aa2f7,nobold]'
set -g status-right '#[bg=#16161e,fg=#292e42,nobold,noitalics,nounderscore]#[bg=#292e42,fg=#a9b1d6] %Y-%m-%d  %H:%M #[bg=#292e42,nobold,noitalics,nounderscore]#{?client_prefix,#[fg=##ff9e64],#{?pane_in_mode,#[fg=##7aa2f7],#{?pane_synchronized,#[fg=##bb9af7],#[fg=##3b4261]}}}#{tmux_mode_indicator}'
set -g @mode_indicator_prefix_mode_style 'bg=#ff9e64,fg=#16161e'
set -g @mode_indicator_copy_mode_style 'bg=#7aa2f7,fg=#16161e'
set -g @mode_indicator_sync_mode_style 'bg=#bb9af7,fg=#16161e'
set -g @mode_indicator_empty_mode_style 'bg=#3b4261,fg=#c0caf5'
set -g @fingers-hint-style 'fg=#ff9e64,bold'
set -g @fingers-highlight-style 'fg=#e0af68'
