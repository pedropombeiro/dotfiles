# Turn on mouse support
set -g mouse on

# Update terminal/tab titles
set -g set-titles on
# Use pane command instead of #W (nerd font icons break in OS title bar)
set -g set-titles-string "#S - #{pane_current_command}"

set-option -g focus-events on
set-option -g allow-passthrough all # Allow not only the active tmux panel to passthrough (on), but all panels to passthrough, so that progress shows through from inactive panels

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable VI mode
setw -g mode-keys vi

# Enable clipboard integration via OSC 52 for remote sessions
set -g set-clipboard on
set -as terminal-features ',tmux*:clipboard'
set -as terminal-features ',xterm*:bpaste'
set -ga terminal-overrides ',*-256color:Tc'

# Pass PageUp/PageDown through to applications (don't enter copy mode)
unbind-key -T root PPage
unbind-key -T root NPage

# Don't copy on mouse drag release — just keep the selection; press Enter to copy
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# Skip confirmation prompt when killing panes
bind-key -N "Kill pane without confirmation" x kill-pane

# Don't detach when closing the last pane in a session
set -g detach-on-destroy off

# Use the mouse drag to re-order windows
bind-key -n MouseDrag1Status swap-window -t=

# Reload config
bind -N "Reload tmux configuration" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Source local overrides (QNAP terminal fixes, etc.)
if-shell '[ -f ~/.config/tmux/tmux.platform.conf ]' 'source-file ~/.config/tmux/tmux.platform.conf'

set -g @tmux-gruvbox 'dark256' # or 'light256'
set -g @tmux-gruvbox-statusbar-alpha 'true'
set -g @tmux-gruvbox-right-status-z '#{tmux_mode_indicator}'

# TPM plugin manager path (required by TPM scripts)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"

# List of plugins
set -g @plugin tmux-plugins/tpm
set -g @plugin tmux-plugins/tmux-sensible
set -g @plugin tmux-plugins/tmux-pain-control
set -g @plugin egel/tmux-gruvbox
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

set -g @plugin 'MunifTanjim/tmux-mode-indicator'
## Mode indicator prompts
set -g @mode_indicator_prefix_prompt ' WAIT '
set -g @mode_indicator_copy_prompt ' COPY '
set -g @mode_indicator_sync_prompt ' SYNC '
set -g @mode_indicator_empty_prompt ' TMUX '
set -g @mode_indicator_prefix_mode_style 'bg=colour214,fg=colour237'
set -g @mode_indicator_copy_mode_style 'bg=colour109,fg=colour237'
set -g @mode_indicator_sync_mode_style 'bg=colour208,fg=colour237'
set -g @mode_indicator_empty_mode_style 'bg=colour248,fg=colour237'

set -g @plugin 'christoomey/vim-tmux-navigator' # Pairs with https://github.com/christoomey/vim-tmux-navigator
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"
set -g @vim_navigator_mapping_prev "M-^" # Avoid M-\ (ESC \), which terminates terminal responses and breaks Yazi's probe

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Alt+number: Jump to window directly (no prefix)
# Must come AFTER TPM to avoid being overwritten by plugins
bind-key -n -N "Jump to last window" M-0 select-window -t '{end}'
bind-key -n -N "Jump to window 1" M-1 select-window -t :1
bind-key -n -N "Jump to window 2" M-2 select-window -t :2
bind-key -n -N "Jump to window 3" M-3 select-window -t :3
bind-key -n -N "Jump to window 4" M-4 select-window -t :4
bind-key -n -N "Jump to window 5" M-5 select-window -t :5
bind-key -n -N "Jump to window 6" M-6 select-window -t :6
bind-key -n -N "Jump to window 7" M-7 select-window -t :7
bind-key -n -N "Jump to window 8" M-8 select-window -t :8
bind-key -n -N "Jump to window 9" M-9 select-window -t :9

# Unbind prefix + hjkl pane navigation (redundant with M-hjkl via vim-tmux-navigator)
unbind h
unbind j
unbind k
unbind l

# prefix + l: Launch lazygit (uses yadm when in $HOME or ~/.config)
bind -N "Open lazygit" l run-shell 'case "#{pane_current_path}" in "$HOME"|"$HOME/.config"*) tmux split-window -Z -c "$HOME" "GIT_DIR=$HOME/.local/share/yadm/repo.git GIT_WORK_TREE=$HOME lazygit --use-config-dir ~/.config/lazygit";; *) tmux split-window -Z -c "#{pane_current_path}" "lazygit --use-config-dir ~/.config/lazygit";; esac'

# prefix + f: Launch fm (zoomed)
bind -N "Open fm" f run-shell 'tmux split-window -Z -c "#{pane_path}" "zsh -ilc \"fm\""'

# prefix + y: Yank last command output
bind -N "Copy last command output" y copy-mode \; send-keys -X previous-prompt -o \; send-keys -X begin-selection \; send-keys -X next-prompt \; send-keys -X cursor-up \; send-keys -X end-of-line \; send-keys -X copy-pipe-and-cancel "pbcopy"

# prefix + Y: Yank current command line text (sends \e[Y to trigger zle widget)
bind -N "Copy current command line" Y send-keys Escape '[Y'

# prefix + h: Open the cheat sheet for the program in the pane (picker for shells and others)
bind -N "Open cheat sheet" h display-popup -E -w 70% -h 60% -d "#{pane_current_path}" -e CHEAT_FZF_HEIGHT=100% "~/.local/bin/cheat --for-command '#{pane_current_command}'"

# prefix + T: Sesh session picker
# sesh-list-waiting marks sessions with an OpenCode agent waiting for input (orange bullet).
# Rows are "<sesh row>\t<session name>\t<display row>". fd rows have a single field, so
# showing the last field (-1) and accepting the first still resolve to the directory.
bind-key -N "Choose session with sesh" "T" run-shell "sesh connect \"$(
  ~/.local/bin/sesh-list-waiting --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt 'sesh> ' \
    --delimiter '\t' --with-nth -1 --accept-nth 1 \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(sesh> )+reload(~/.local/bin/sesh-list-waiting --icons)' \
    --bind 'ctrl-t:change-prompt(tmux> )+reload(~/.local/bin/sesh-list-waiting -t --icons)' \
    --bind 'ctrl-g:change-prompt(config> )+reload(~/.local/bin/sesh-list-waiting -c --icons)' \
    --bind 'ctrl-x:change-prompt(zoxide> )+reload(~/.local/bin/sesh-list-waiting -z --icons)' \
    --bind 'ctrl-f:change-prompt(find> )+reload(fd --type d --max-depth 2 --hidden --exclude .Trash --exclude .git . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2})+change-prompt(sesh> )+reload(~/.local/bin/sesh-list-waiting --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {1}'
)\""

# prefix + L: Switch to last session via sesh
bind -N "last-session (via sesh)" L run-shell "sesh last"

# prefix + o: Launch opencode (new session)
# prefix + O: Launch opencode (resume session)
bind -N "Open new OpenCode session" o split-window -h -p 40 -c "#{pane_path}" "zsh -ilc 'oc'"
bind -N "Resume OpenCode session" O split-window -h -p 40 -c "#{pane_path}" "zsh -ilc 'oc -c'"

# Use pane_current_path for new windows and panes
# These bindings must come AFTER TPM to override tmux-pain-control
bind -N "New window in current directory" c new-window -c "#{pane_path}"
bind -N "Split vertically in current directory" '"' split-window -v -c "#{pane_path}"
bind -N "Split horizontally in current directory" '%' split-window -h -c "#{pane_path}"
bind -N "Split horizontally in current directory" '|' split-window -h -c "#{pane_path}"
bind -N "Split full-width horizontally in current directory" '\' split-window -fh -c "#{pane_path}"
bind -N "Split vertically in current directory" '-' split-window -v -c "#{pane_path}"
bind -N "Split full-height vertically in current directory" '_' split-window -fv -c "#{pane_path}"

# Extend the which-key menu after TPM loads it, without editing plugin-local files.
# Dispatch to the existing bindings so menu actions stay in sync with their shortcuts.
set -g @wk_menu_tools 'Sesh "s" "send-keys -K C-b T" Lazygit "l" "send-keys -K C-b l" Fm "f" "send-keys -K C-b f" "New OpenCode" "o" "send-keys -K C-b o" "Resume OpenCode" "O" "send-keys -K C-b O" "Copy output" "y" "send-keys -K C-b y" "Copy command" "Y" "send-keys -K C-b Y" "Cheat sheet" "h" "send-keys -K C-b h"'
set -ga @wk_menu_root ' "Tools" "t" "show-wk-menu #{@wk_menu_tools}"'

# Re-source platform overrides after TPM so that gruvbox doesn't clobber
# host-specific status-left customizations (e.g. NAS red session indicator)
if-shell '[ -f ~/.config/tmux/tmux.platform.conf ]' 'source-file ~/.config/tmux/tmux.platform.conf'

# OpenCode tmux tab indicator: @opencode-waiting user option (set by opencode-tmux-indicator)
# When set, inactive tabs turn gruvbox orange with a bullet prefix, matching the
# orange used for the OpenCode waiting state on the Busylight and Apollo MSR-2.
# The plugin also sends a BEL to the pane TTY so tmux sets window_bell_flag,
# enabling Prefix+M-n to jump to windows waiting for input.
set -gw window-status-bell-style default  # override gruvbox red bg that bleeds into powerline arrows
set -g bell-action none                   # suppress BEL forwarding and messages; window_bell_flag is still set
set -gw window-status-format "#{?@opencode-waiting,#[bg=colour214#,fg=colour237#,noitalics],#[bg=colour239#,fg=colour237#,noitalics]}#{?@opencode-waiting,#[bg=colour214#,fg=colour237],#[bg=colour239#,fg=colour223]} #I #{?@opencode-waiting,#[bg=colour214#,fg=colour237],#[bg=colour239#,fg=colour223]} #{?@opencode-waiting,● ,}#W#{?window_zoomed_flag,*Z,} #{?window_end_flag,#[bg=default],#[bg=colour237]}#{?@opencode-waiting,#[fg=colour214#,noitalics],#[fg=colour239#,noitalics]}"

# Active tab: override gruvbox's colour214 (yellow2/orange) with colour109 (blue2)
# so orange stays reserved for the OpenCode waiting indicator. The active tab keeps
# its blue background when waiting and shows an orange bullet instead, since the
# background already encodes "active".
set -gw window-status-current-format "#[bg=colour109,fg=colour237,nobold,noitalics,nounderscore]#[bg=colour109,fg=colour239] #I #[bg=colour109,fg=colour239,bold] #{?@opencode-waiting,#[fg=colour214]● #[fg=colour239],}#W#{?window_zoomed_flag,*Z,} #{?window_end_flag,#[bg=default],#[bg=colour237]}#[fg=colour109,nobold,noitalics,nounderscore]"
