# Turn on mouse support
set -g mouse on

# Update terminal/tab titles
set -g set-titles on
# Use pane command instead of #W (nerd font icons break in OS title bar)
set -g set-titles-string "#S - #{pane_current_command}"

# Mirror active pane descriptions into iTerm2 subtitles on local and SSH clients.
# Reserve our own hook index so reloads don't duplicate or replace other hooks.
# Run on all attached clients: the event's pane need not be the displayed pane.
# Run in the background (-b) so tmux never waits on terminal writes: an unread
# client would otherwise block hooks and config reloads.
set-hook -g 'client-attached[21337]' 'run-shell -b "~/.config/tmux/iterm2-subtitle"'
set-hook -g 'client-session-changed[21337]' 'run-shell -b "~/.config/tmux/iterm2-subtitle"'
set-hook -g 'session-window-changed[21337]' 'run-shell -b "~/.config/tmux/iterm2-subtitle"'
set-hook -gw 'window-pane-changed[21337]' 'run-shell -b "~/.config/tmux/iterm2-subtitle"'
set-hook -gw 'pane-title-changed[21337]' 'run-shell -b "~/.config/tmux/iterm2-subtitle"'
set-hook -g 'client-detached[21337]' 'if-shell -F "#{m:iTerm2*,#{client_termtype}}" { run-shell -b "~/.config/tmux/iterm2-subtitle --clear #{q:client_tty}" }'
run-shell -b '~/.config/tmux/iterm2-subtitle'

set-option -g focus-events on
set-option -g allow-passthrough all # Allow not only the active tmux panel to passthrough (on), but all panels to passthrough, so that progress shows through from inactive panels

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable VI mode
setw -g mode-keys vi

# Enable clipboard integration via OSC 52 for remote sessions
set -g set-clipboard on
set -as terminal-features ',tmux*:clipboard'
set -as terminal-features ',xterm*:bpaste'
set -ga terminal-overrides ',*-256color:Tc'

# Pass PageUp/PageDown through to applications (don't enter copy mode)
unbind-key -T root PPage
unbind-key -T root NPage

# Don't copy on mouse drag release — just keep the selection; press Enter to copy
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# Vim-style visual modes. tmux binds both keys to rectangle-toggle, which only
# reshapes a selection started with Space. Without a selection, v starts a
# characterwise selection and C-v a rectangular one. With a selection, C-v
# toggles its shape, and v returns to characterwise or ends the selection.
bind-key -T copy-mode-vi v if-shell -F '#{selection_present}' { if-shell -F '#{rectangle_toggle}' { send-keys -X rectangle-off } { send-keys -X clear-selection } } { send-keys -X rectangle-off ; send-keys -X begin-selection }
bind-key -T copy-mode-vi C-v if-shell -F '#{selection_present}' { send-keys -X rectangle-toggle } { send-keys -X rectangle-on ; send-keys -X begin-selection }

# Skip confirmation prompt when killing panes
bind-key -N "Kill pane without confirmation" x kill-pane

# Don't detach when closing the last pane in a session
set -g detach-on-destroy off

# Use the mouse drag to re-order windows
bind-key -n MouseDrag1Status swap-window -t=

# Reload config
bind -N "Reload tmux configuration" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Source local overrides (QNAP terminal fixes, etc.)
if-shell '[ -f ~/.config/tmux/tmux.platform.conf ]' 'source-file ~/.config/tmux/tmux.platform.conf'

source-file ~/.config/tmux/theme.conf

# TPM plugin manager path (required by TPM scripts)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins/"

# List of plugins
set -g @plugin tmux-plugins/tpm
set -g @plugin tmux-plugins/tmux-sensible
set -g @plugin tmux-plugins/tmux-pain-control
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

set -g @plugin 'MunifTanjim/tmux-mode-indicator'
## Mode indicator prompts
set -g @mode_indicator_prefix_prompt ' WAIT '
set -g @mode_indicator_copy_prompt ' COPY '
set -g @mode_indicator_sync_prompt ' SYNC '
set -g @mode_indicator_empty_prompt ' TMUX '

set -g @plugin 'Morantron/tmux-fingers'
## mise installs the tmux-fingers binary, so skip the install and update wizards
set -g @fingers-skip-wizard 1
## The default jump key (J) would replace tmux-pain-control's resize binding; Prefix v and F are bound below
set -g @fingers-enable-bindings 0
set -g @fingers-show-copied-notification 1
set -g @fingers-backdrop-style 'dim'
## GitLab MR and issue references, for example !12345 or gitlab-org/gitlab#678
set -g @fingers-pattern-0 '(?<![[:alnum:]_./-])([[:alnum:]_.-]+/[[:alnum:]_./-]*)?[!#][0-9]{2,}\b'
## file:line and file:line:col locations from RSpec, RuboCop, and grep output.
## The lookbehind anchors matches to a word start, so URL host:port is skipped.
set -g @fingers-pattern-1 '(?<![[:alnum:]_.~/:-])[[:alnum:]_.~/-]*[[:alnum:]_-]\.[[:alnum:]]+:[0-9]+(:[0-9]+)?'
## Paths without sentence-ending dots, for example ~/.github/cheatsheets/tmux.md.
## Custom patterns precede built-ins in the alternation, so this wins over `path`.
set -g @fingers-pattern-2 '([.\w~$@-]+)?(/[.\w@-]+)+/?(?<!\.)'

set -g @plugin 'christoomey/vim-tmux-navigator' # Pairs with https://github.com/christoomey/vim-tmux-navigator
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"
set -g @vim_navigator_mapping_prev "M-^" # Avoid M-\ (ESC \), which terminates terminal responses and breaks Yazi's probe

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.local/share/tmux/plugins/tpm/tpm'

# Alt+number: Jump to window directly (no prefix)
# Must come AFTER TPM to avoid being overwritten by plugins
bind-key -n -N "Jump to last window" M-0 select-window -t '{end}'
bind-key -n -N "Jump to window 1" M-1 select-window -t :1
bind-key -n -N "Jump to window 2" M-2 select-window -t :2
bind-key -n -N "Jump to window 3" M-3 select-window -t :3
bind-key -n -N "Jump to window 4" M-4 select-window -t :4
bind-key -n -N "Jump to window 5" M-5 select-window -t :5
bind-key -n -N "Jump to window 6" M-6 select-window -t :6
bind-key -n -N "Jump to window 7" M-7 select-window -t :7
bind-key -n -N "Jump to window 8" M-8 select-window -t :8
bind-key -n -N "Jump to window 9" M-9 select-window -t :9

# Unbind prefix + hjkl pane navigation (redundant with M-hjkl via vim-tmux-navigator)
unbind h
unbind j
unbind k
unbind l

# prefix + g: Git via lazygit; keep l as a compatibility alias.
# Uses yadm in $HOME or ~/.config unless a Git repository encloses the pane path.
# Preserve tmux's move-mode shortcut on uppercase G.
bind -N "Enter pane/window move mode" G switch-client -T move
bind -N "Open lazygit" l run-shell 'git -C "#{pane_current_path}" rev-parse --git-dir >/dev/null 2>&1 && p=repo || p="#{pane_current_path}"; case "$p" in "$HOME"|"$HOME/.config"|"$HOME/.config/"*) tmux split-window -Z -c "$HOME" "GIT_DIR=$HOME/.local/share/yadm/repo.git GIT_WORK_TREE=$HOME lazygit --use-config-dir ~/.config/lazygit";; *) tmux split-window -Z -c "#{pane_current_path}" "lazygit --use-config-dir ~/.config/lazygit";; esac'
bind -N "Open lazygit (Git)" g send-keys -K C-b l

# prefix + f: Launch fm (zoomed)
bind -N "Open fm" f run-shell 'tmux split-window -Z -c "#{pane_path}" "zsh -ilc \"fm\""'

# prefix + y: Yank last command output
# Target the invoking client directly; copy-mode's pane redraw path can skip OSC 52.
bind -N "Copy last command output" y copy-mode \; send-keys -X previous-prompt -o \; send-keys -X begin-selection \; send-keys -X next-prompt \; send-keys -X cursor-up \; send-keys -X end-of-line \; send-keys -X copy-pipe-and-cancel -C -P 'tmux load-buffer -w -t #{q:client_name} -'

# prefix + v: Visual hint copy; keep F as an alias (tmux-fingers).
bind -N "Copy text on screen with hints" v send-keys -K C-b F
bind -N "Copy text on screen with hints" F run -b "#{@fingers-cli} start #{pane_id}"

# prefix + u: Copy unfinished command line; keep Y as an alias.
# Sends \e[Y to trigger the zle widget.
bind -N "Copy current command line" u send-keys -K C-b Y
bind -N "Copy current command line" Y send-keys Escape '[Y'

# prefix + h: Open the cheat sheet for the program in the pane (picker for shells and others).
# run-shell expands formats, unlike display-popup's command, and cheat --tmux opens a popup
# only when it needs a terminal.
bind -N "Open cheat sheet" h run-shell -b -c "#{pane_current_path}" "~/.local/bin/cheat --tmux --for-command '#{pane_current_command}'"

# prefix + s: Sesh session picker; keep T as a compatibility alias.
# sesh-list-waiting marks sessions with an OpenCode agent waiting for input (orange bullet).
# Rows are "<sesh row>\t<session name>\t<display row>". fd rows have a single field, so
# showing the last field (-1) and accepting the first still resolve to the directory.
# The preview calls the mise install directly: it runs on every cursor move, and the
# mise shim adds about 100 ms of startup per call.
bind-key -N "Choose session with sesh" "T" run-shell "sesh connect \"$(
  ~/.local/bin/sesh-list-waiting -t --icons | ~/.local/bin/dotfiles-fzf --tmux -p 80%,70% \
    --ansi --border-label ' sesh ' --prompt 'tmux> ' \
    --delimiter '\t' --with-nth -1 --accept-nth 1 \
    --header '  ^a all ^p projects ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up,change:first' \
    --bind 'ctrl-a:change-prompt(sesh> )+reload(~/.local/bin/sesh-list-waiting --icons)' \
    --bind 'ctrl-p:change-prompt(projects> )+reload(~/.local/bin/sesh-list-waiting --projects --icons)' \
    --bind 'ctrl-t:change-prompt(tmux> )+reload(~/.local/bin/sesh-list-waiting -t --icons)' \
    --bind 'ctrl-g:change-prompt(config> )+reload(~/.local/bin/sesh-list-waiting -c --icons)' \
    --bind 'ctrl-x:change-prompt(zoxide> )+reload(~/.local/bin/sesh-list-waiting -z --icons)' \
    --bind 'ctrl-f:change-prompt(find> )+reload(fd --type d --max-depth 2 --hidden --exclude .Trash --exclude .git . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2})+change-prompt(sesh> )+reload(~/.local/bin/sesh-list-waiting --icons)' \
    --preview-window 'right:55%:nohidden' \
    --preview '~/.local/share/mise/installs/aqua-joshmedeski-sesh/latest/sesh preview --watch {1}'
)\""

# Keep the native session tree available without displacing the sesh mnemonic.
bind -N "Choose session with sesh" s send-keys -K C-b T
bind -N "Choose session with native tmux tree" C-s choose-tree -Zs

# prefix + backtick: Previous session; keep S as an alias and L for pane resizing.
bind -N "Switch to this client's previous session" '`' switch-client -l
bind -N "Switch to this client's previous session" S switch-client -l

# prefix + o: Launch opencode (new session)
# prefix + O: Launch opencode (resume session)
bind -N "Open new OpenCode session" o split-window -h -p 40 -c "#{pane_path}" "zsh -ilc 'oc'"
bind -N "Resume OpenCode session" O split-window -h -p 40 -c "#{pane_path}" "zsh -ilc 'oc -c'"

# Use pane_current_path for new windows and panes
# These bindings must come AFTER TPM to override tmux-pain-control
bind -N "New window in current directory" c new-window -c "#{pane_path}"
bind -N "Split vertically in current directory" '"' split-window -v -c "#{pane_path}"
bind -N "Split horizontally in current directory" '%' split-window -h -c "#{pane_path}"
bind -N "Split horizontally in current directory" '|' split-window -h -c "#{pane_path}"
bind -N "Split full-width horizontally in current directory" '\' split-window -fh -c "#{pane_path}"
bind -N "Split vertically in current directory" '-' split-window -v -c "#{pane_path}"
bind -N "Split full-height vertically in current directory" '_' split-window -fv -c "#{pane_path}"

# Frequent menu actions use the same keys as their prefix bindings.
# Dispatch through those bindings so launch commands have a single source of truth.
set -g @wk_menu_tools '"New OpenCode" "o" "send-keys -K C-b o" "Resume OpenCode" "O" "send-keys -K C-b O"'
set -g @wk_menu_root '\
"Sesh sessions" "s" "send-keys -K C-b s" \
"Previous session" "`" "send-keys -K C-b `" \
"Git (Lazygit)" "g" "send-keys -K C-b g" \
"Files (fm)" "f" "send-keys -K C-b f" \
"" \
"Copy output" "y" "send-keys -K C-b y" \
"Copy command line" "u" "send-keys -K C-b u" \
"Copy with hints" "v" "send-keys -K C-b v" \
"App cheat sheet" "h" "send-keys -K C-b h" \
"" \
"Run command" "Space" command-prompt \
"Last window" "Tab" last-window \
"Last pane" ";" last-pane \
"" \
"+Windows" "w" "show-wk-menu #{@wk_menu_windows}" \
"+Panes" "p" "show-wk-menu #{@wk_menu_panes}" \
"+Copy mode" "c" "show-wk-menu #{@wk_menu_copy}" \
"+Buffers" "b" "show-wk-menu #{@wk_menu_buffers}" \
"+Sessions" "a" "show-wk-menu #{@wk_menu_sessions}" \
"+Client" "C" "show-wk-menu #{@wk_menu_client}" \
"+Tools" "t" "show-wk-menu #{@wk_menu_tools}" \
"" \
"Show messages" "\~" show-messages \
"Clock" "T" clock-mode \
"All keybindings" "?" "list-keys -N"'
# The plugin snapshots the root menu into an alias at load time. Refresh that
# alias after replacing the menu, including on every config reload.
set -gF command-alias[201] 'show-wk-menu-root=#{@wk_cmd_show} #{@wk_menu_root}'
bind -N "Show frequent actions and keybinding menus" Space show-wk-menu-root

# Re-source platform overrides after theme and plugin initialization to preserve
# host-specific status-left customizations (e.g. NAS red session indicator).
if-shell '[ -f ~/.config/tmux/tmux.platform.conf ]' 'source-file ~/.config/tmux/tmux.platform.conf'

# OpenCode tmux tab indicator: @opencode-waiting user option (set by opencode-tmux-indicator)
# When set, inactive tabs turn orange with a bullet prefix, matching the
# orange used for the OpenCode waiting state on the Busylight and Apollo MSR-2.
# The plugin also sends a BEL to the pane TTY so tmux sets window_bell_flag,
# enabling Prefix+M-n to jump to windows waiting for input.
set -g bell-action none                   # suppress BEL forwarding and messages; window_bell_flag is still set

# Active tabs remain blue when waiting and show an orange bullet instead, since
# the background already encodes "active".
source-file ~/.config/tmux/theme-status.conf
