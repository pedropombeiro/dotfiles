name: CI

"on":
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Cancel in-progress runs when new commit pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: hk check
  hk-check:
    name: hk check
    runs-on: ubuntu-latest
    env:
      MISE_ENV: ci
      MISE_ENV_CONF_D: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          # Keep in sync with min_version in .config/mise/conf.d/global.toml
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.9.14"

      # Install zsh for syntax checking
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # Run hk check on all files
      # Skip steps that require tools not available in CI (ruby, renovate).
      # no-yadm-alt-symlinks is a no-op outside a yadm work tree; the
      # yadm-render job runs it against a real one.
      - name: Run hk check
        run: hk check --all
        env:
          HK_SKIP_STEPS: standardrb,renovate-config-validator

  # Job 2: Luacheck for Neovim Lua files
  # Kept as a separate job because hk's global exclude hides .config/
  luacheck:
    name: Luacheck (Neovim Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run luacheck
        uses: nebularg/actions-luacheck@d4137dd840545b28521ed21931e06913d93c0bc1 # v1
        with:
          files: ".config/nvim"
          args: "--config .luacheckrc --formatter plain"

  # Job 3: Neovim config validation
  neovim-validate:
    name: Neovim config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Install Neovim (latest stable)
      - name: Install Neovim
        run: |
          curl -fLO --retry 3 --retry-delay 5 https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-x86_64.tar.gz
          sudo tar xzf nvim-linux-x86_64.tar.gz -C /usr/local --strip-components=1
          nvim --version

      # Test config loads without errors
      - name: Test Neovim config loads
        run: |
          # Create minimal test that loads config
          nvim --headless --noplugin -u NONE -c "
            set runtimepath+=$HOME/.config/nvim
            lua dofile(vim.fn.expand('.config/nvim/lua/config/init.lua'))
            lua =print('Config module loaded successfully')
          " -c 'quitall!' 2>&1 | tee nvim-output.log

          # Check for Lua errors
          if grep -i "error" nvim-output.log; then
            echo "Neovim config has errors"
            exit 1
          fi

          echo "Neovim config validation passed"

  # Job 4: Bootstrap script validation
  bootstrap-validate:
    name: Bootstrap scripts syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Validate bash syntax for all bootstrap scripts
      # Note: shellcheck runs in hk-check job
      - name: Bash syntax check
        run: |
          echo "Checking bash syntax for bootstrap scripts..."
          EXIT_CODE=0

          # Find all .sh files (not symlinks)
          while IFS= read -r script; do
            echo "Checking: $script"
            if ! bash -n "$script"; then
              echo "❌ Syntax error in: $script"
              EXIT_CODE=1
            else
              echo "✓ Syntax OK: $script"
            fi
          done < <(find .config/yadm/bootstrap.d -type f -name '*.sh')

          # Check main bootstrap script
          echo "Checking: .config/yadm/bootstrap"
          if ! bash -n .config/yadm/bootstrap; then
            echo "❌ Syntax error in: .config/yadm/bootstrap"
            EXIT_CODE=1
          else
            echo "✓ Syntax OK: .config/yadm/bootstrap"
          fi

          exit $EXIT_CODE

  # Job 5: Render alternates and templates for each machine identity
  # Clones the repo into a scratch HOME with yadm, overrides class/os/distro,
  # runs `yadm alt`, then validates the result. Uses --yadm-dir outside the
  # work tree so the repo's own hooks (relink, prune) don't run.
  yadm-render:
    name: yadm alt (${{ matrix.class }}, ${{ matrix.os }}${{ matrix.distro && format(', {0}', matrix.distro) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - class: Personal
            os: Darwin
          - class: Work
            os: Darwin
          - class: Personal
            os: Linux
          - class: NAS
            os: Linux
            distro: qts
    env:
      # renovate: datasource=github-tags depName=yadm-dev/yadm
      YADM_VERSION: "3.5.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install zsh, Lua, and yadm
        run: |
          sudo apt-get update && sudo apt-get install -y zsh lua5.4
          command -v luac >/dev/null || sudo ln -s "$(command -v luac5.4)" /usr/local/bin/luac
          sudo curl -fsSL --retry 3 --retry-delay 5 -o /usr/local/bin/yadm \
            "https://raw.githubusercontent.com/yadm-dev/yadm/${YADM_VERSION}/yadm"
          sudo chmod +x /usr/local/bin/yadm
          yadm version

      - name: Clone into a scratch HOME
        run: |
          scratch="${RUNNER_TEMP}/yadm"
          mkdir -p "${scratch}/home" "${scratch}/bin"
          # Shim so every `yadm` call, including those in the check scripts,
          # uses the scratch yadm dir and repo
          printf '#!/bin/sh\nexec /usr/local/bin/yadm --yadm-dir "%s/dir" --yadm-data "%s/data" "$@"\n' \
            "${scratch}" "${scratch}" >"${scratch}/bin/yadm"
          chmod +x "${scratch}/bin/yadm"
          echo "${scratch}/bin" >>"${GITHUB_PATH}"
          echo "HOME=${scratch}/home" >>"${GITHUB_ENV}"
          export HOME="${scratch}/home" PATH="${scratch}/bin:${PATH}"
          yadm clone --no-bootstrap -w "${HOME}" "${GITHUB_WORKSPACE}"
          # yadm clone can leave tracked files unrestored in a fresh work tree
          yadm checkout -- "${HOME}"
          test -z "$(yadm status --porcelain)"

      - name: Render alternates
        run: |
          yadm config local.class "${{ matrix.class }}"
          yadm config local.os "${{ matrix.os }}"
          if [ -n "${{ matrix.distro }}" ]; then
            yadm config local.distro "${{ matrix.distro }}"
          fi
          yadm alt

      - name: Validate rendered files
        run: zsh "${HOME}/.config/yadm/scripts/check-rendered-alts.zsh"

      - name: No alt symlinks committed
        run: yadm ls-files -z | xargs -0 zsh "${HOME}/.config/yadm/scripts/check-no-alt-symlinks.zsh"

  # Job 6: Secret scanning
  secret-scanning:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Full history for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Uncomment if org repo
